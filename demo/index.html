<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>morse-wasm demo</title>
  <style>
    :root {
      --bg: #11161c;
      --panel: #1a212a;
      --panel-2: #232c37;
      --border: #2c3744;
      --text: #e6edf3;
      --muted: #94a3b8;
      --accent: #5eead4;
      --good: #4ade80;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      font-weight: 600;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
    }
    .hint {
      color: var(--muted);
      margin: 0 0 20px;
    }
    code {
      background: var(--panel-2);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.92em;
    }
    label.block {
      display: block;
      margin: 14px 0;
      color: var(--muted);
      font-size: 13px;
    }
    textarea {
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-top: 6px;
      font: inherit;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      resize: vertical;
    }
    .status {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .status.ready { color: var(--good); }
    .status.error { color: var(--bad); }
  </style>
</head>
<body>
  <header>morse-wasm demo</header>

  <main>
    <h1>Rust → WebAssembly Morse codec</h1>
    <p class="hint">
      Both <code>encode</code> and <code>decode</code> run inside a ~23 KB
      <code>.wasm</code> module. Type into either box — the other side updates live.
    </p>

    <label class="block">
      Plain text:
      <textarea id="text" rows="3" placeholder="Type some text…"></textarea>
    </label>

    <label class="block">
      Morse (single space between letters, <code> / </code> between words):
      <textarea id="morse" rows="3" placeholder="… or paste some morse here"></textarea>
    </label>

    <div id="status" class="status">Loading wasm…</div>
  </main>

  <script type="module">
    import init, { encode, decode } from '../pkg/morse_wasm.js';

    const text = document.getElementById('text');
    const morse = document.getElementById('morse');
    const status = document.getElementById('status');

    try {
      await init();
      status.textContent = 'wasm module loaded.';
      status.classList.add('ready');
    } catch (err) {
      status.textContent = `failed to load wasm: ${err}`;
      status.classList.add('error');
      throw err;
    }

    let editing = null;

    text.addEventListener('input', () => {
      if (editing === 'morse') return;
      editing = 'text';
      morse.value = encode(text.value);
      editing = null;
    });

    morse.addEventListener('input', () => {
      if (editing === 'text') return;
      editing = 'morse';
      text.value = decode(morse.value);
      editing = null;
    });
  </script>
</body>
</html>
